apiVersion: v1
kind: Namespace
metadata: { name: secure-banking }
---
apiVersion: v1
kind: Secret
metadata: { name: banking-secrets, namespace: secure-banking }
type: Opaque
stringData:
  JWT_SECRET: replace-me-with-kubectl-secret
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mongo, namespace: secure-banking }
spec:
  replicas: 1
  selector: { matchLabels: { app: mongo } }
  template:
    metadata: { labels: { app: mongo } }
    spec:
      containers:
        - name: mongo
          image: mongo:8.0
          ports: [{ containerPort: 27017 }]
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: mongo, namespace: secure-banking }
spec: { selector: { app: mongo }, ports: [{ port: 27017 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: backend, namespace: secure-banking }
spec:
  replicas: 1
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: backend
          image: secure-banking-api:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 4000 }]
          env:
            - { name: MONGO_URI, value: mongodb://mongo:27017/secure_banking }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: banking-secrets, key: JWT_SECRET } } }
          readinessProbe: { httpGet: { path: /ready, port: 4000 }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 4000 }, initialDelaySeconds: 10 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: backend, namespace: secure-banking }
spec: { selector: { app: backend }, ports: [{ port: 4000 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: secure-banking }
spec:
  replicas: 1
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: secure-banking-web:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 300m, memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: secure-banking }
spec: { type: NodePort, selector: { app: frontend }, ports: [{ port: 80, nodePort: 30080 }] }

